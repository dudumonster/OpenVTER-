    :root {
      --bg: #f6f8fc;
      --ink: #1f2937;
      --muted: #667085;
      --line: #a8b3c7;
      --panel: #ffffff;
      --backbone: #eef4ff;
      --neck: #f5f0ff;
      --head: #fff5ee;
      --conv: #ffd9ba;
      --fusion: #e9c9f3;
      --concat: #f5c8d5;
      --up: #c7edf0;
      --fcm: #f6efaf;
      --mkp: #f5d4b5;
      --sppf: #d9f1f1;
      --branch: #dce9bf;
      --out: #ebe6d7;
      --accent: #4f46e5;
      --accent2: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .page {
      padding: 20px 24px 28px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .title h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
    }
    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 980px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar button {
      border: 1px solid #cfd6e4;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .toolbar .hint {
      color: var(--muted);
      font-size: 13px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 22px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .canvas-wrap {
      background: #fff;
      border: 1px solid #d9e0ed;
      border-radius: 20px;
      padding: 14px;
      overflow: auto;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.06);
    }
    .zoom-layer {
      transform-origin: top left;
      transition: transform 180ms ease;
      width: max-content;
    }
    svg {
      display: block;
      width: 1760px;
      height: 1020px;
      max-width: none;
    }
    .panel-title {
      font-weight: 700;
      font-size: 20px;
      fill: var(--ink);
    }
    .small-note {
      font-size: 13px;
      fill: var(--muted);
    }
    .node {
      stroke: rgba(60,72,92,0.12);
      stroke-width: 1.2;
      rx: 12;
      ry: 12;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .index {
      font-size: 14px;
      fill: var(--muted);
      text-anchor: end;
      dominant-baseline: middle;
    }
    .path {
      fill: none;
      stroke: #344054;
      stroke-width: 2.2;
      marker-end: url(#arrow);
    }
    .guide {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-dasharray: 8 8;
      marker-end: url(#arrow-accent);
    }
    .callout-title {
      font-size: 18px;
      font-weight: 700;
      fill: var(--ink);
    }
    .callout-text {
      font-size: 14px;
      fill: var(--muted);
    }
  </style>
</head>

  <script>
    let scale = 1;
    const zoomLayer = document.getElementById('zoomLayer');
    function applyScale() {
      zoomLayer.style.transform = `scale(${scale})`;
    }
    function zoom(factor) {
      scale = Math.max(0.6, Math.min(2.4, scale * factor));
      applyScale();
    }
    function resetZoom() {
      scale = 1;
      applyScale();
    }
    window.zoom = zoom;
    window.resetZoom = resetZoom;
    applyScale();
  </script>
