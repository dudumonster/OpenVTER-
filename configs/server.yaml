project_name: OpenVTER
task: video_inference
workflow_steps: [1, 3]
step: 3
config_parameter: 1
multiprocessing: false

data_dir: /public/home/dudu030900/road_config/drone_data_video/dong_guan/shang_tang_gong_yuan
output_dir: ${data_dir}/output_server39
log_dir: ${project_root}/logs/server39
checkpoint_dir: ${project_root}/checkpoints

batch_size: 96
num_workers: 0
device: cuda:0
epochs: 1
learning_rate: 0.001

video_file:
  - ${data_dir}/shang_tang_gong_yuan_001.MP4
road_config: /public/home/dudu030900/road_config/shang_tang_gong_yuan/background_shang_tang_gong_yuan_001.json
save_folder: ${output_dir}
stabilize_file: shang_tang_gong_yuan_001_stab.pkl
out_fps: 29.97
output_video: 1
output_img: 0
inference_batch_size: ${batch_size}
bbox_label: [id, cat, score, lane]
pipeline: [stab, det]
split_gap: 160
subsize_height: 448
subsize_width: 560
stabilize_scale: 0
video_start_frame: 0
video_end_frame: 0
track_cat_smooth: true
track_cat_window: 7
track_cat_min_samples: 3
track_len_smooth: true
track_len_window: 7
track_history_ttl: 200
vehicle_length_thresholds: [5.4, 6.8, 9.5, 12.0]
global_category:
  - car
  - truck
  - bus
  - freight_car
  - van
  - pedestrian
  - people
  - bicycle
  - tricycle
  - awning-tricycle
  - motor
global_color_pans:
  - [204, 78, 210]
  - [0, 192, 255]
  - [0, 131, 0]
  - [240, 176, 0]
  - [254, 100, 38]
  - [0, 255, 255]
  - [255, 0, 255]
  - [255, 255, 0]
  - [0, 128, 255]
  - [128, 0, 255]
  - [255, 128, 0]

detection:
  - model_name: centernet_bbavectors
    checkpoint_type: jit
    checkpoint_jit: ${checkpoint_dir}/centernet_bbavectors/centernet_bbavectors_oneclass_M_202206.jit
    confidence: 0.3
    img_width: 640
    img_height: 512
    device_name: ${device}
    class_names: [car, truck, bus, freight_car, van]
    color_pans: "[(204,78,210),(204,78,210),(204,78,210),(204,78,210),(204,78,210)]"
    down_ratio: 4
    max_object_num: 100
  - model_name: yolov5
    checkpoint: ${checkpoint_dir}/tph-yolov5/yolov5l-xs-1.pt
    repo_dir: ${project_root}/tph-yolov5
    device_name: ${device}
    confidence: 0.35
    nms_iou: 0.45
    img_width: 640
    img_height: 640
    classes: [0, 1, 2, 6, 7, 9]
    class_id_map: [5, 6, 7, 0, 0, 0, 8, 9, 0, 10]

tracking:
  - model_name: sort_r
    device: cpu
    match_iou_threshold1: 0.9
    match_iou_threshold2: 0.2
    max_age: 30
    min_hits: 3
    iou_threshold: 0.3
    class_ids: [0, 1, 2, 3, 4]
    id_offset: 0
  - model_name: sort_r
    device: cpu
    match_iou_threshold1: 0.9
    match_iou_threshold2: 0.2
    max_age: 30
    min_hits: 3
    iou_threshold: 0.3
    class_ids: [5, 6, 7, 8, 9, 10]
    id_offset: 100000
